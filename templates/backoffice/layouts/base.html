{% load static %}
<!DOCTYPE html>
<html lang="en" {% if request.session.theme == 'dark' %}data-theme="dark"{% endif %}>
<head>
  <meta charset="UTF-8">
  <title>{% block title %}MindLens Admin{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="{% static 'css/backoffice.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% include 'backoffice/partials/sidebar.html' %}
  
  <div class="admin-main">
    {% include 'backoffice/partials/navbar.html' %}
    
    <main class="p-4">
      {% block content %}{% endblock %}
    </main>
    
    <!-- Quote Section - Matches Frontoffice -->
    <section class="text-center py-4 quote-section">
      <p id="quote" class="quote-script mt-3"></p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Mobile sidebar toggle
    function toggleSidebar() {
      const sidebar = document.querySelector('.admin-sidebar');
      sidebar.classList.toggle('show');
    }
    
    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', function(e) {
      const sidebar = document.querySelector('.admin-sidebar');
      const toggleBtn = document.querySelector('.sidebar-toggle');
      
      if (window.innerWidth <= 768 && 
          !sidebar.contains(e.target) && 
          !toggleBtn.contains(e.target)) {
        sidebar.classList.remove('show');
      }
    });

    // Theme switching functionality
    function changeTheme(theme) {
      const html = document.documentElement;
      html.setAttribute('data-theme', theme);
      
      // Store in localStorage
      localStorage.setItem('theme', theme);
      
      // Optional: Send to Django backend to persist in session
      fetch('/admin/set-theme/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
        },
        body: JSON.stringify({ theme: theme })
      }).catch(error => console.error('Error saving theme:', error));
    }

    // Load saved theme on page load
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      const themeSelect = document.getElementById('theme-select');
      
      if (themeSelect) {
        themeSelect.value = savedTheme;
      }
      
      document.documentElement.setAttribute('data-theme', savedTheme);
      
      // Quote rotation - matches frontoffice
      const quotes = [
        "Your story is valid.",
        "Feel it. Write it. Heal it.",
        "You are more than your mood.",
        "Reflection is a form of self-love.",
        "Admin insights shape user experiences."
      ];
      let i = 0;
      const quoteEl = document.getElementById("quote");
      if (quoteEl) {
        quoteEl.textContent = `"${quotes[i]}"`;
        setInterval(() => {
          i = (i + 1) % quotes.length;
          quoteEl.innerHTML = `<span class="fade-out">${quoteEl.textContent}</span>`;
          setTimeout(() => {
            quoteEl.textContent = `"${quotes[i]}"`;
          }, 200);
        }, 5000);
      }
    });

    // Add fade animation for quotes
    const style = document.createElement('style');
    style.textContent = `
      .quote-script {
        animation: fadeInQuote 1s ease-in-out;
      }
      .fade-out {
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      @keyframes fadeInQuote {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    `;
    document.head.appendChild(style);
  </script>
  
  {% block extra_js %}{% endblock %}
</body>
</html>
