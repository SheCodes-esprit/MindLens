<nav class="admin-navbar">
  <div class="navbar-left d-flex align-items-center">
    <button class="btn btn-link d-md-none sidebar-toggle me-3" onclick="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="bi bi-list fs-4"></i>
    </button>
    
    <div>
      <h1 class="page-title mb-0">{% block page_title %}Dashboard{% endblock %}</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          {% block breadcrumb %}
          <li class="breadcrumb-item"><a href="{% url 'dashboard' %}">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Dashboard</li>
          {% endblock %}
        </ol>
      </nav>
    </div>
  </div>
  
  <div class="navbar-right d-flex align-items-center gap-3">
    <!-- Theme Selector -->
    <select id="theme-select" class="theme-dropdown form-select" onchange="changeTheme(this.value)">
      <option value="blush" {% if request.session.theme == 'blush' or not request.session.theme %}selected{% endif %}>Blush</option>
      <option value="ocean" {% if request.session.theme == 'ocean' %}selected{% endif %}>Ocean</option>
      <option value="forest" {% if request.session.theme == 'forest' %}selected{% endif %}>Forest</option>
      <option value="sunset" {% if request.session.theme == 'sunset' %}selected{% endif %}>Sunset</option>
      <option value="lavender" {% if request.session.theme == 'lavender' %}selected{% endif %}>Lavender</option>
    </select>
    
    <!-- Notifications -->
    <div class="dropdown">
      <button class="btn btn-link p-2 position-relative text-accent" type="button" data-bs-toggle="dropdown" aria-label="Notifications">
        <i class="bi bi-bell fs-5">
          <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill">3</span>
        </i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><h6 class="dropdown-header">Notifications</h6></li>
        <li><a class="dropdown-item" href="#"><i class="bi bi-person-plus text-success me-2"></i>New user</a></li>
        <li><a class="dropdown-item" href="#"><i class="bi bi-flag text-warning me-2"></i>Content reported</a></li>
        <li><a class="dropdown-item" href="#"><i class="bi bi-check-circle text-success me-2"></i>Backup completed</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="#">View all</a></li>
      </ul>
    </div>
    
    <!-- User Menu -->
    <div class="dropdown">
      <button class="btn btn-link d-flex align-items-center p-2 text-accent" type="button" data-bs-toggle="dropdown" aria-label="User menu">
        <img src="https://tryeasel.dev/placeholder.svg?width=32&height=32" alt="Admin" class="rounded-circle me-2" width="32" height="32">
        <span class="d-none d-md-inline">Admin User</span>
        <i class="bi bi-chevron-down ms-1 d-none d-md-inline"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="{% url 'home' %}"><i class="bi bi-box-arrow-up-right me-2 text-accent"></i>View Frontend</a></li>
        <li><a class="dropdown-item" href="#"><i class="bi bi-box-arrow-right me-2 text-danger"></i>Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- CSRF Token -->
{% csrf_token %}
