{% extends 'frontoffice/layouts/base.html' %}
{% block content %}
<section class="login-section py-5">
  <div class="container">
    <h2 class="text-center mb-4">Reset Password</h2>
    <form method="POST" class="col-md-6 mx-auto">
      {% csrf_token %}
      <div class="mb-3">
        <label for="new_password" class="form-label">New Password:</label>
        <input type="password" class="form-control" name="new_password" id="new_password" required>
        {% if errors.new_password %}<small class="text-danger">{{ errors.new_password }}</small>{% endif %}
      </div>
      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm New Password:</label>
        <input type="password" class="form-control" name="confirm_password" id="confirm_password" required>
        {% if errors.confirm_password %}<small class="text-danger">{{ errors.confirm_password }}</small>{% endif %}
      </div>
      <button type="submit" class="btn btn-success w-100">Reset Password</button>
    </form>
  </div>
</section>
{% endblock %}
