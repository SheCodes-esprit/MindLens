{% extends 'frontoffice/layouts/base.html' %}

{% block content %}
<h2>Confirmer la Suppression</h2>
<p>Êtes-vous sûr de vouloir supprimer l'entrée "{{ entry.type }} - {{ entry.created_at|date:'M d, Y' }}" ?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Oui, Supprimer</button>
    <a href="{% url 'visual_list' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
