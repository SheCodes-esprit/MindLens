{% extends 'frontoffice/layouts/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">
<div class="profile-container">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="settings-section profile-card animate__animated animate__fadeInDown">
                    <div class="section-header text-center">
                        <h4><i class="bi bi-exclamation-triangle me-2"></i>Disable Two-Factor Authentication</h4>
                        <p class="section-description">Are you sure you want to disable 2FA?</p>
                    </div>

                    <div class="alert alert-warning" role="alert">
                        <i class="bi bi-exclamation-circle me-2"></i>
                        <strong>Warning:</strong> Disabling 2FA will make your account less secure. You'll only need your password to log in.
                    </div>

                    <form method="POST" class="settings-form">
                        {% csrf_token %}
                        
                        <div class="form-actions">
                            <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-danger">Disable 2FA</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
