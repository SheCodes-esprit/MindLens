{% extends 'frontoffice/layouts/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/entry_stats.css' %}">

<section class="entries-section container py-5">
  <div class="visual-hero text-center mb-5">
      <div class="floating-icons">
          <i class="bi bi-emoji-smile float-icon"></i>
          <i class="bi bi-emoji-frown float-icon"></i>
          <i class="bi bi-emoji-expressionless float-icon"></i>
          <i class="bi bi-journal-text float-icon"></i>
          <i class="bi bi-bar-chart-line float-icon"></i>
      </div>
      <h2>Text Entries Dashboard</h2>
  </div>

  <div class="d-flex flex-wrap gap-4 justify-content-center mb-5">
    <div class="glass-card p-4" style="min-width:200px;">
      <h5>Most Common Mood This Month</h5>
      <p class="fs-2 fw-bold">{{ most_common_mood }}</p>
    </div>
    <div class="glass-card p-4" style="min-width:200px;">
      <h5>Total Entries</h5>
      <p class="fs-2 fw-bold">{{ total_entries }}</p>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-4 justify-content-center">
    <div class="glass-card p-3" style="flex:1; min-width:300px; max-width:600px;">
      <h5 class="mb-3">Sentiment Trend Over Time</h5>
      <canvas id="sentimentChart" height="200"></canvas>
    </div>
    <div class="glass-card p-3" style="flex:1; min-width:300px; max-width:400px;">
      <h5 class="mb-3">Mood Distribution</h5>
      <canvas id="moodPieChart" height="200"></canvas>
    </div>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  new Chart(document.getElementById('sentimentChart'), {
      type: 'line',
      data: { labels: {{ labels }}, datasets: {{ line_datasets }} },
      options: {
          responsive: true,
          plugins: {
              legend: { labels: { color: '#555' } },
              tooltip: { mode: 'index', intersect: false }
          },
          interaction: { mode: 'index', intersect: false },
          scales: {
              x: { ticks: { color: '#555' }, grid: { color: 'rgba(0,0,0,0.05)' } },
              y: { ticks: { color: '#555' }, grid: { color: 'rgba(0,0,0,0.05)' }, beginAtZero: true }
          }
      }
  });

  new Chart(document.getElementById('moodPieChart'), {
      type: 'pie',
      data: {
          labels: {{ pie_labels }},
          datasets:[{
              data: {{ pie_counts }},
              backgroundColor: {{ pie_colors }},
              borderWidth: 1,
              borderColor: '#fff'
          }]
      },
      options: {
          responsive: true,
          plugins: { 
            legend: { 
              position: 'bottom', 
              labels: { color: '#555', boxWidth:20, padding:15 } 
            } 
          }
      }
  });
</script>

<style>
  #moodPieChart { display: block; margin: 0 auto; }

  .glass-card {
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    transition: all 0.3s ease;
    background: #fff;
    text-align: center;
  }
  .glass-card:hover { box-shadow: 0 10px 28px rgba(0,0,0,0.07); }

  @media(max-width:768px){
    .d-flex.flex-wrap.gap-4 { flex-direction: column; align-items: center; }
  }
</style>
{% endblock %}
