{% extends 'frontoffice/layouts/base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card shadow-lg border-0 animate__animated animate__fadeInDown">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-check" style="font-size: 3rem; color: #ff6b81;"></i>
                        <h3 class="mt-3">Two-Factor Authentication</h3>
                        <p class="text-muted">Enter the code sent to your email</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="alert alert-info" role="alert">
                            <i class="bi bi-info-circle me-2"></i>
                            Code sent to <strong>{{ user_email }}</strong>
                        </div>

                        <div class="form-group mb-4">
                            <label for="otp" class="form-label">
                                <i class="bi bi-key me-2"></i>Enter OTP Code
                            </label>
                            <input type="text" class="form-control form-control-lg {% if errors.otp %}is-invalid{% endif %}" 
                                   id="otp" name="otp" 
                                   placeholder="000000"
                                   maxlength="6"
                                   inputmode="numeric"
                                   required
                                   autofocus>
                            {% if errors.otp %}
                            <div class="invalid-feedback d-block">{{ errors.otp }}</div>
                            {% endif %}
                            <small class="form-text text-muted d-block mt-2">
                                <i class="bi bi-clock me-1"></i>Code expires in 5 minutes
                            </small>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg">Verify & Login</button>
                        
                        <div class="text-center mt-3">
                            <a href="{% url 'signin' %}" class="text-muted">Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
