{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reflect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  {% include 'frontoffice/partials/navbar.html' %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% include 'frontoffice/partials/footer.html' %}

  <script>
    const quotes = [
      "“Your story is valid.”",
      "“Feel it. Write it. Heal it.”",
      "“You are more than your mood.”",
      "“Reflection is a form of self-love.”"
    ];
    let i = 0;
    const quoteEl = document.getElementById("quote");
    if (quoteEl) {
      quoteEl.textContent = quotes[i];
      setInterval(() => {
        i = (i + 1) % quotes.length;
        quoteEl.textContent = quotes[i];
      }, 4000);
    }

 function setTheme(theme) {
  const root = document.documentElement;

  if (theme === 'blush') {
    root.style.setProperty('--bg', '#fff0f5');
    root.style.setProperty('--text', '#2d3436');
    root.style.setProperty('--accent', '#ff6b81');
    root.style.setProperty('--title-color', '#2d3436');
    root.style.setProperty('--card-title-color', '#2d3436');
    root.style.setProperty('--card-body-color', '#2d3436');
    root.style.setProperty('--quote-color', '#ff6b81');
  } else if (theme === 'midnight') {
  root.style.setProperty('--bg', '#1e1e2f');
  root.style.setProperty('--text', '#f1f2f6');
  root.style.setProperty('--accent', '#a29bfe');
  root.style.setProperty('--title-color', '#ffffff');
  root.style.setProperty('--card-title-color', '#000000'); 
  root.style.setProperty('--card-body-color', '#000000');  
  root.style.setProperty('--quote-color', '#a29bfe');
}
 else if (theme === 'forest') {
    root.style.setProperty('--bg', '#eafaf1');
    root.style.setProperty('--text', '#2d3436');
    root.style.setProperty('--accent', '#00b894');
    root.style.setProperty('--title-color', '#2d3436');
    root.style.setProperty('--card-title-color', '#2d3436');
    root.style.setProperty('--card-body-color', '#2d3436');
    root.style.setProperty('--quote-color', '#00b894');
  } else if (theme === 'ocean') {
    root.style.setProperty('--bg', '#e3f2fd');
    root.style.setProperty('--text', '#2d3436');
    root.style.setProperty('--accent', '#0984e3');
    root.style.setProperty('--title-color', '#2d3436');
    root.style.setProperty('--card-title-color', '#2d3436');
    root.style.setProperty('--card-body-color', '#2d3436');
    root.style.setProperty('--quote-color', '#0984e3');
  } else if (theme === 'clay') {
    root.style.setProperty('--bg', '#fbeee0');
    root.style.setProperty('--text', '#2d3436');
    root.style.setProperty('--accent', '#d35400');
    root.style.setProperty('--title-color', '#2d3436');
    root.style.setProperty('--card-title-color', '#2d3436');
    root.style.setProperty('--card-body-color', '#2d3436');
    root.style.setProperty('--quote-color', '#d35400');
  }
}
document.addEventListener("DOMContentLoaded", () => {
  setTheme("blush"); 
});

  </script>
</body>
</html>
