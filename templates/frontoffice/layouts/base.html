{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MindLens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Great+Vibes&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  {% include 'frontoffice/partials/navbar.html' %}
  <main>
    {% block content %}{% endblock %}
  </main>
<section class="text-center py-4">
  <p id="quote" class="quote-script mt-3"></p>
</section>
  {% include 'frontoffice/partials/footer.html' %}
  <script>
  const quotes = [
    "“Your story is valid.”",
    "“Feel it. Write it. Heal it.”",
    "“You are more than your mood.”",
    "“Reflection is a form of self-love.”"
  ];
  let i = 0;
  const quoteEl = document.getElementById("quote");
  if (quoteEl) {
    quoteEl.textContent = quotes[i];
    setInterval(() => {
      i = (i + 1) % quotes.length;
      quoteEl.textContent = quotes[i];
    }, 4000);
  }
</script>
</body>
</html>
